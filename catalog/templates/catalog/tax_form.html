{% extends "base.html" %}
{% block title %}{% if tax %}Edit tax{% else %}New tax{% endif %}{% endblock %}
{% block content %}
<h1 class="h4 mb-3">{% if tax %}Edit {{ tax.name }}{% else %}New tax{% endif %}</h1>

<form method="post">
  {% csrf_token %}
  <div class="card mb-3"><div class="card-body">
    {{ form.as_div }}
  </div></div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-outline-secondary" href="{% url 'tax_list' %}">Cancel</a>
</form>
{% endblock %}
