{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body">
      <h1 class="h4 mb-3">Create your account</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_div }}
        <button class="btn btn-primary w-100 mt-3">Sign up</button>
      </form>
      <p class="mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Log in</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
