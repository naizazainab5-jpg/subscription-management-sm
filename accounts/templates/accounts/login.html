{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body">
      <h1 class="h4 mb-3">Log in</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_div }}
        <button class="btn btn-primary w-100 mt-3">Log in</button>
      </form>
      <p class="mt-3 mb-0"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
      <p class="mt-3 mb-0">No account? <a href="{% url 'signup' %}">Sign up</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
